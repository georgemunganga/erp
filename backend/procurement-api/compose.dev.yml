services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: erp
      POSTGRES_USER: procurement_dev
      POSTGRES_PASSWORD: procurement_dev_only
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U procurement_dev -d erp"]
      interval: 5s
      timeout: 3s
      retries: 12
    volumes:
      - procurement_dev_pg:/var/lib/postgresql/data

  migrate:
    build: .
    command: ["--apply-migrations-only"]
    environment:
      ConnectionStrings__Procurement: Host=postgres;Port=5432;Database=erp;Username=procurement_dev;Password=procurement_dev_only
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build: .
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ERP__AuthMode: disabled
      ConnectionStrings__Procurement: Host=postgres;Port=5432;Database=erp;Username=procurement_dev;Password=procurement_dev_only
    ports:
      - "127.0.0.1:18081:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  procurement_dev_pg:
