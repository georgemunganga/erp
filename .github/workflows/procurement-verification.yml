name: Procurement verification

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/procurement-verification.yml'
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/procurement-verification.yml'

permissions:
  contents: read

concurrency:
  group: procurement-verification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      document-postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: doc_test
          POSTGRES_PASSWORD: synthetic-document-fixture
          POSTGRES_DB: core_docs_rehearsal
        ports:
          - 127.0.0.1:5432:5432
        options: >-
          --health-cmd "pg_isready -U doc_test -d core_docs_rehearsal"
          --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend/hrm-api
    env:
      DOTNET_NOLOGO: 'true'
      DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: backend/hrm-api/global.json
      - name: Procurement domain and persistence tests
        run: >-
          dotnet test ../procurement-api/src/Mightyfin.Erp.Procurement.Tests
          --configuration Release --logger trx --results-directory ../../artifacts/procurement-tests
      - name: Core approval tests
        run: >-
          dotnet test ../core-api/src/Mightyfin.Erp.Core.Approvals.Tests
          --configuration Release --logger trx --results-directory ../../artifacts/core-approval-tests
      - name: Core document lifecycle tests
        run: >-
          dotnet test ../core-api/src/Mightyfin.Erp.Core.Documents.Tests
          --configuration Release --logger trx --results-directory ../../artifacts/core-document-tests
      - name: Core document PostgreSQL transaction probe
        env:
          CORE_DOCUMENT_TEST_CONNECTION: Host=127.0.0.1;Database=core_docs_rehearsal;Username=doc_test;Password=synthetic-document-fixture
        run: dotnet run --project ../core-api/tools/CoreDocumentWorkflowProbe --configuration Release
      - name: Build Core scanner verification tool
        run: dotnet build ../core-api/tools/CoreDocumentScannerProbe --configuration Release
      - name: Procurement HTTP, identity and authorization tests
        run: >-
          dotnet test src/Mightyfin.Erp.Hrm.Tests
          --configuration Release --filter FullyQualifiedName~Procurement
          --logger trx --results-directory ../../artifacts/host-tests
      - name: Check migration snapshots
        run: |
          dotnet tool install dotnet-ef --tool-path ../../.tools --version 10.0.11
          ../../.tools/dotnet-ef migrations has-pending-model-changes --no-build --configuration Release --project ../procurement-api/src/Mightyfin.Erp.Procurement.Infrastructure --context ProcurementDbContext
          ../../.tools/dotnet-ef migrations has-pending-model-changes --no-build --configuration Release --project ../core-api/src/Mightyfin.Erp.Core.Approvals.Infrastructure --context ApprovalDbContext
          ../../.tools/dotnet-ef migrations has-pending-model-changes --no-build --configuration Release --project ../core-api/src/Mightyfin.Erp.Core.Documents.Infrastructure --context DocumentDbContext
      - name: Publish ERP candidate
        run: >-
          dotnet publish src/Mightyfin.Erp.Hrm.Api --configuration Release
          --no-restore --no-self-contained --output ../../artifacts/api
      - name: Check candidate against retained loan data contract
        run: dotnet run --project tools/PayrollLoanCompatibilityProbe --configuration Release -- ../../artifacts/api
      - name: Retain test evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: procurement-test-results
          path: artifacts/**/*/*.trx
          if-no-files-found: ignore
          retention-days: 7
      - name: Retain verified build
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: verified-erp-api
          path: artifacts/api/
          if-no-files-found: error
          retention-days: 7
